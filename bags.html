<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOIRÉ | Bags</title>
<link rel="stylesheet" href="style.css">
</head>

<body>
	<header class="header">
		<div class="header-left">
			<button class="menu-btn">MENU</button>
			<button class="search-btn">SEARCH</button>
		</div>
	
		<div class="logo">NOIRÉ</div>
	
		<div class="header-right">
			<button class="cart-btn">
			<span>BAG</span>
			<span class="cart-count">(0)</span>
			</button>
		</div>
		
	</header>
	
	<main>
		<section class="category-page">
			<div class="category-page-header">
				<p>EXPLORE OUR COLLECTION</p>
				<h1>BAGS</h1>
				<a href="index.html">BACK TO HOME &rarr;</a>
			</div>
			
			<div class="product-toolbar">
				<p>3 PRODUCTS</p>
				
				<select id="sort-products">
					<option value="defult">Sort By</option>
					<option value="low-high">Price: Low to High</option>
					<option value="high-low">Price: High to Low</option>
				</select>
			</div>
			
			<div class="products-grid">
				<div class="product-card" data-price="90">
					<div class="product-image">
						<img src="images/bags1.jpg" alt="Classic Bag">
					</div>		
					<div class="product-info">
						<h3>Classic Bag</h3>
						<p>90$</p>
					</div>
				</div>
			<!--2-->
				<div class="product-card" data-price="45">
        			<div class="product-image">
           				<img src="images/bags2.jpg" alt="Minimal Bag">
       				</div>

        			<div class="product-info">
            			<h3>Minimal Bag</h3>
            			<p>$45</p>
        			</div>
				</div>
			<!--3-->	
				<div class="product-card" data-price="140">
       				<div class="product-image">
            			<img src="images/bags3.jpg" alt="Fantesy Bag">
       				</div>

        			<div class="product-info">
            			<h3>Fantasy Bag</h3>
            			<p>$140</p>
        			</div>
    			</div>
		</div>
		</section>
	
	
	</main>
	<script>
		
		let sortSelect = document.getElementById("sort-products");
		let productsGrid = document.querySelector(".products-grid");

		if (sortSelect && productsGrid) {

    		let products = Array.from(
        		productsGrid.querySelectorAll(".product-card")
    		);

    	sortSelect.addEventListener("change", function() {

        let sortedProducts = [...products];

        if (sortSelect.value === "low-high") {

            sortedProducts.sort(function(a, b) {
                return Number(a.dataset.price) - Number(b.dataset.price);
            });

        } else if (sortSelect.value === "high-low") {

            sortedProducts.sort(function(a, b) {
                return Number(b.dataset.price) - Number(a.dataset.price);
            });

        }

        sortedProducts.forEach(function(product) {
            productsGrid.appendChild(product);
        });

    });

}

		
	
	</script>
</body>
</html>
